name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一分支的连续推送只保留最新一次运行
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # GitHub Pages 项目页需要 /<repo>/ 前缀；部署到自定义域名/平台时改为 '/'
      VITEPRESS_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # PDF 字体依赖：中文（Noto Sans/Serif CJK）与西文（Liberation）
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-liberation

      # typst 固定版本（与本地开发一致；升级时同步修改）
      - name: Cache typst
        id: cache-typst
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/typst
          key: typst-0.14.2

      - name: Install typst
        if: steps.cache-typst.outputs.cache-hit != 'true'
        run: |
          curl -sL https://github.com/typst/typst/releases/download/v0.14.2/typst-x86_64-unknown-linux-musl.tar.xz | tar -xJ
          sudo install typst-x86_64-unknown-linux-musl/typst /usr/local/bin/

      - name: Verify typst
        run: typst --version

      - run: pnpm install --frozen-lockfile

      # 先预生成 PDF 到 content/public/pdfs/，再构建站点（public 随构建复制进 dist）
      - run: pnpm prebuild:pdf

      - run: pnpm build

      # 冒烟测试：验证下载中心与章节卡片（需要 Chromium）
      - name: Install Chromium for smoke test
        run: npx playwright-core install chromium-headless-shell

      - name: Smoke test
        run: pnpm smoke

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
